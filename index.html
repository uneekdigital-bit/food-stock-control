<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Food Stock Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17212b}header{background:#194d33;color:#fff;padding:16px;position:sticky;top:0;z-index:5}main{max-width:1000px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 7px #0002}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,button{font-size:16px;padding:11px;border:1px solid #bbb;border-radius:9px}input,select{width:100%}button{cursor:pointer;font-weight:700}.primary{background:#194d33;color:#fff;border:0}.warn{background:#ffe2a8}.danger{background:#f4caca}.good{background:#d9f0df}.muted{color:#667}.big{font-size:34px;font-weight:800}.tabs button{font-size:14px}.hide{display:none}.pill{display:inline-block;padding:5px 9px;border-radius:18px;background:#edf1f4}.manager{background:#dce9ff}.picker{background:#e8f7e8}.qa_manager{background:#fff0c7}.qa{background:#f0e2ff}.full{width:100%}.small{font-size:13px}.batch{border-top:1px solid #ddd;padding-top:10px;margin-top:10px}.qrbtn{background:#eef4ff}.rolebox{border:2px solid #194d33}.expired{background:#ffd4d4}.soon{background:#fff0c7}.pickedItem{background:#eceff1!important;opacity:.72}.pickedItem .pickedText{text-decoration:line-through;text-decoration-color:#c62828;text-decoration-thickness:3px}.pickedDoneBtn{background:#b0b7bd;color:#fff;border:0;cursor:default}.scanOverlay{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}.scanOverlay.hide{display:none!important}.scanDialog{background:#fff;border-radius:14px;padding:16px;max-width:500px;width:100%}.scanVideo{width:100%;max-height:55vh;background:#111;border-radius:10px}.qrLabelRow{border-top:1px solid #ddd;padding:12px 0}.qrLabelRow input[type=checkbox]{width:auto;transform:scale(1.25)}.toolbarSticky{position:sticky;top:62px;background:#fff;z-index:4;padding:10px;border-radius:12px;box-shadow:0 1px 6px #0002}
</style>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#17365d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Food Stock">
<link rel="apple-touch-icon" href="/icons/icon.svg">
</head>
<body>
<header><b>FOOD SUPPLY — QR STOCK CONTROL</b> <span id="who" class="small"></span></header>
<main>
<div id="auth" class="card">
  <h2>Sign in</h2>
  <div class="grid"><div><label>Staff username</label><input id="username" type="text" autocomplete="username" placeholder="e.g. john"></div><div><label>Password</label><input id="password" type="password" autocomplete="current-password"></div></div>
  <div class="row" style="margin-top:10px"><button id="signin" class="primary">SIGN IN</button></div>
  <p id="authmsg" class="muted"></p><p class="small muted">Manager username: <b>uneekdigital</b>. Staff accounts use their assigned username.</p>
</div>
<div id="app" class="hide">
  <div class="card rolebox">
    <div class="row"><div><b>Access:</b> <span id="rolepill" class="pill"></span></div><div class="muted" id="displayname"></div></div>
    <div id="managerClaim" class="hide" style="margin-top:10px"><p class="small">First manager only: enter the setup code to unlock Stock In / administration.</p><div class="row"><input id="managerCode" placeholder="Manager setup code" style="max-width:300px"><button id="claimManager" class="primary">UNLOCK MANAGER</button></div></div>
  </div>
  <div class="card tabs row">
    <button id="stockBtn">STOCK / PICK</button>
    <button id="expiryBtn">EXPIRY</button>
    <button id="historyBtn">MY HISTORY</button>
    <button id="recipesBtn">RECIPES</button>
    <button id="pickListsBtn">PICK LIST</button>
    <button id="concessionsBtn" class="mgrqa hide">CONCESSIONS</button>
    <button id="newProductBtn" class="mgr hide">NEW PRODUCT</button>
    <button id="receiveBtn" class="mgr hide">STOCK IN</button>
    <button id="qrLabelsBtn" class="mgr hide">QR LABELS</button>
    <button id="usersBtn" class="useradmin hide">USERS</button>
    <button id="installAppBtn" class="installadmin hide primary">INSTALL APP</button>
    <button id="logout">SIGN OUT</button>
  </div>
  <div class="card"><input id="search" placeholder="Scan QR / product code / product name"><button id="searchBtn" class="primary" style="margin-top:8px">SEARCH</button></div>
  <div id="content"></div>
</div>
</main>
<div id="itemScanOverlay" class="scanOverlay hide">
  <div class="scanDialog">
    <h2>Scan Batch QR</h2>
    <p id="itemScanTitle" class="muted"></p>
    <video id="itemScanVideo" class="scanVideo" playsinline></video>
    <div class="row" style="margin-top:10px"><button id="itemScanCancel" style="flex:1">CANCEL</button></div>
    <p id="itemScanMsg" class="small muted">Point the camera at the batch QR label.</p>
  </div>
</div>
<script src="/js/app-1.js"></script>
<script src="/js/app-2.js"></script>
<script src="/js/app-3.js"></script>
<script src="/js/app-4.js"></script>
<script src="/js/app-5.js"></script>
<script src="/js/app-6.js"></script>
<script src="/js/new-product.js"></script>
<script src="/js/app-install.js"></script>
</body></html>
